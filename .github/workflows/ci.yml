name: Offline tests and publication security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline bridge tests
        run: python3 -m unittest discover -s . -p 'test_*.py' -v
      - name: Publication policy tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check tracked file policy
        run: python3 scripts/security_check.py --all
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location "$url/gitleaks_8.30.1_linux_x64.tar.gz" --output gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan all reachable Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --exit-code 1'
