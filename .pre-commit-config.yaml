repos:
  - repo: local
    hooks:
      - id: publication-policy
        name: Source-only publication and privacy policy
        entry: python3 scripts/security_check.py
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
